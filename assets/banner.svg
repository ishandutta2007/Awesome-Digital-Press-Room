<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="title-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".07"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes float1{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(1deg)}}@keyframes float2{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(10px) rotate(-1deg)}}@keyframes pulse-wave{0%{stroke-dashoffset:1000}}@keyframes orb-glow{0%{opacity:.3;transform:scale(1)}50%{opacity:.6;transform:scale(1.15)}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-size:46px;font-weight:800;fill:url(#title-grad);letter-spacing:-.5px}.subtitle{font-size:19px;font-weight:400;fill:#94a3b8}.badge-text{font-size:13px;font-weight:600;fill:#e2e8f0}.floating-card-1{animation:float1 6s ease-in-out infinite}.floating-card-2{animation:float2 8s ease-in-out infinite}.orb-1{animation:orb-glow 7s ease-in-out infinite;transform-origin:200px 100px}.orb-2{animation:orb-glow 9s ease-in-out infinite;transform-origin:1000px 220px}.wave-line{stroke-dasharray:50 15;animation:pulse-wave 30s linear infinite}</style></defs><rect width="1200" height="320" fill="url(#bg-grad)" rx="16"/><circle cx="200" cy="8